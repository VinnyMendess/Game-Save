<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <header>
        <div class="logo">
            <p>GameSave</p>
        </div>
        <div class="search">
            <input type="text" placeholder="Buscar Jogo">
        </div>
        <div class="add-game">
            <button>Adicionar Jogo</button>
        </div>
    </header>


    <main>
        <div class="title-main">
            <h1>Sua Biblioteca <div class="count-games">0</div></h1>

            <div class="box-title">
                <a href="">Todos</a>
                <a href="">Platinados</a>
            </div>
        </div>

    </div>
    
    <div class="add-game-container">
        <div class="title">Novo Jogo</div>

        <div class="box-input">
        <div class="input">
            <p>Nome do Jogo</p>
            <input type="text" placeholder="ex: The Witcher 3">
        </div>
        <div class="input">
            <p>Horas Jogadas</p>
            <input type="text" placeholder="0">
        </div>
        <div class="input">
            <p>Data de Conclusão</p>
            <input type="text">
        </div>

        </div>
        <div class="box-input">
            <div class="input">
                <p>Plataforma</p>
                <label for="Plataforma">Escolha a plataforma</label>
                <select name="plataforma" id="plataforma">
                    <option value="PlayStation">PlayStation</option>
                    <option value="Xbox">Xbox</option>
                    <option value="Nintendo">Nintendo</option>
                    <option value="PC">PC</option>
                    
                </select>
                
            </div>
            <div class="input">
                <label for="midia">Midia</label>
                <select name="midia" id="midia">
                    <option value="digital">Digital</option>
                    <option value="Física">Física</option>
                </select>
            </div>

            <div class="action">
                
            </div>
        </div>
    </div>

    <div class="container-main">
        <div class="info-user">
            <div class="card-info-user">
                <p>Jogados</p>
                <div class="count-card-info-user"></div>
            </div>
            <div class="card-info-user">
                <p>Horas Totais</p>
                <div class="count-card-info-user"></div>
            </div>
            <div class="card-info-user">
                <p>Platinados</p>
                <div class="count-card-info-user"></div>
            </div>
            <div class="card-info-user">
                <p>Lista de Desejos</p>
                <div class="count-card-info-user"></div>
            </div>

            <div class="info-games">
                <div class="card-info-games">
                    <div class="img"></div>
                    <div class="box"><div class="genero">RPG</div>
                    <div class="nota">9.5</div>
                </div>
                    <div class="title">The Witcher 3</div>
                    <div class="midia"></div>
                </div>
            </div>

            
        
        </div>
        
    </main>

    
</body>
</html>
